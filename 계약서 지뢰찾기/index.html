<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>계약서 지뢰찾기 | 자취:ON</title><style>
:root{--ink:#17231f;--green:#123e32;--lime:#c9ef66;--cream:#f0eadb;--paper:#fffdf5;--red:#e84934}*{box-sizing:border-box}body{margin:0;background:#d8d1c2;color:var(--ink);font-family:Arial,"Noto Sans KR",sans-serif}button{font:inherit}.app{min-height:100dvh;max-width:540px;margin:auto;background:var(--cream);overflow:hidden}.top{padding:18px 21px;display:flex;justify-content:space-between}.pill{font-size:11px;background:#ded6c4;padding:7px 10px;border-radius:20px}.cover{padding:34px 25px;text-align:center}.docs{width:180px;height:215px;margin:0 auto 32px;background:var(--paper);border:2px solid;box-shadow:10px 10px 0 var(--green);transform:rotate(-4deg);position:relative}.docs:before{content:"";position:absolute;inset:30px 23px;background:repeating-linear-gradient(#999 0 2px,transparent 2px 28px)}.seal{position:absolute;right:20px;bottom:20px;border:4px double var(--red);border-radius:50%;width:65px;height:65px;display:grid;place-items:center;color:var(--red);font-weight:900;z-index:2}.kicker{font-size:11px;letter-spacing:.16em;font-weight:900;color:#6f786d}.cover h1{font-size:50px;line-height:1;margin:8px}.cover h1 em{font-style:normal;color:var(--red)}.lead{line-height:1.7;color:#667069}.rules{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #c9c1b2;border-radius:14px;margin:24px 0}.rules div{padding:13px 3px;border-right:1px solid #c9c1b2}.rules div:last-child{border:0}.rules b,.rules span{display:block}.rules b{font-size:23px}.rules span{font-size:10px}.primary{width:100%;border:0;border-radius:13px;padding:16px;background:var(--green);color:white;font-weight:900;cursor:pointer}.note{font-size:10px;line-height:1.5;color:#777}.gameHead{background:var(--green);color:white;padding:14px 20px;display:flex;justify-content:space-between}.gameHead small,.gameHead b{display:block}.gameHead small{color:var(--lime)}.timer{font-size:27px;font-weight:900}.mission{margin:14px 15px 0;padding:11px 13px;border-radius:12px;background:var(--lime);display:flex;justify-content:space-between}.paper{margin:12px 15px 85px;padding:18px 14px;min-height:680px;background:var(--paper);border:1px solid #b7ae9e}.paper h2{text-align:center;font-family:serif;border-bottom:3px double;padding-bottom:14px}.clause{width:100%;border:0;border-bottom:1px solid #ddd5c8;background:transparent;padding:14px 7px;display:grid;grid-template-columns:25px 1fr auto;gap:8px;text-align:left;position:relative;cursor:crosshair}.clause p{margin:0;font-family:serif;line-height:1.6}.clause.hit{background:#ffe2dc;outline:2px solid var(--red)}.clause.miss{opacity:.5}.tag{font-size:9px;padding:4px 7px;border-radius:12px;background:#ddd}.hit .tag{background:var(--red);color:white}.miss:after{content:"💥";position:absolute;left:50%;top:50%;font-size:28px;animation:boom .58s forwards}.foot{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);height:70px;padding:12px 18px;background:white;display:flex;justify-content:space-between;align-items:center}.foot b{color:var(--red);letter-spacing:3px}.modal{position:fixed;inset:0;background:#0b1814c9;display:flex;align-items:flex-end;justify-content:center;z-index:20}.modalBox{width:min(540px,100%);background:var(--paper);padding:25px 21px 32px;border-radius:25px 25px 0 0}.modalBox h2{font-size:26px}.modalBox blockquote{margin:0 0 16px;padding:13px;background:#eee8dc;border-left:4px solid var(--red);font-family:serif}.tip{background:#edf5db;padding:13px;border-radius:12px;margin:14px 0}.blast{position:fixed;inset:0;z-index:50;display:grid;place-content:center;justify-items:center;color:white;background:#15120f;animation:flash .9s forwards}.blast i{font-style:normal;font-size:100px;animation:pop .7s forwards}.blast b{font-size:27px}.result{min-height:100dvh;background:var(--green)}.resultTop{text-align:center;color:white;padding:38px 20px}.rank{font-size:100px;font-weight:950;color:var(--lime)}.resultBody{background:var(--paper);min-height:55dvh;border-radius:28px 28px 0 0;padding:26px 20px;text-align:center}.found{text-align:left;max-height:250px;overflow:auto}.found div{padding:10px;border-bottom:1px solid #ddd}.secondary{border:0;background:transparent;padding:16px}@keyframes boom{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-70%) scale(.7)}}@keyframes flash{0%{background:white}15%{background:#ffda66}40%{background:#d9472c}100%{background:#15120f}}@keyframes pop{0%{transform:scale(.1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
</style></head><body><main id="app" class="app"></main><script>const POOLS=[{"type":"주택 임대차계약서","stamp":"계약 전","subtitle":"특약과 계약 당사자를 살펴보세요","clauses":[{"id":"ls01","text":"임대인 홍길동과 임차인 김자취는 아래 주택에 관하여 임대차계약을 체결한다.","danger":false},{"id":"ls02","text":"소재지: 서울시 자취구 온동 101동 502호","danger":false},{"id":"ls03","text":"보증금: 금 일억오천만원정 (₩150,000,000)","danger":false},{"id":"ls04","text":"임대차 기간은 2026년 8월 1일부터 2028년 7월 31일까지로 한다.","danger":false},{"id":"ls05","text":"관리비 월 80,000원에는 수도료와 공용전기료가 포함된다.","danger":false},{"id":"ls06","text":"임차인은 입주 즉시 전입신고와 확정일자를 신청할 수 있다.","danger":false},{"id":"ls07","text":"임대인은 보증보험 가입에 필요한 서류 제공에 협조한다.","danger":false},{"id":"ls08","text":"계약 종료 시 임대인은 목적물 인도와 동시에 보증금을 반환한다.","danger":false},{"id":"ls09","text":"입주 전 확인된 벽지 훼손은 별지 사진에 기록한다.","danger":false},{"id":"ls10","text":"임대인은 국세·지방세 납세증명서 확인에 협조한다.","danger":false},{"id":"lr01","text":"임대인은 잔금일 다음 날까지 새로운 담보권을 설정할 수 있다.","danger":true,"title":"잔금 다음 날 담보 설정 허용","why":"대항력 발생 전 새로운 권리가 들어오면 보증금 회수 순위에 영향을 줄 수 있어요.","action":"잔금일 다음 날까지 추가 담보 설정 금지 특약을 협의하세요."},{"id":"lr02","text":"시설물의 모든 수선비는 원인과 관계없이 임차인이 부담한다.","danger":true,"title":"모든 수선 책임 전가","why":"노후·구조적 하자까지 전부 임차인에게 넘기는 문구는 분쟁 가능성이 커요.","action":"소모품, 임차인 과실, 주요 설비 책임을 구체적으로 나누세요."},{"id":"lr03","text":"임대인은 소유권을 제3자에게 이전해도 임차인에게 알리지 않는다.","danger":true,"title":"소유권 변경 미고지","why":"소유자가 바뀌면 보증금 반환 주체와 권리관계를 다시 확인해야 할 수 있어요.","action":"소유권 변동 즉시 고지 조항을 협의하세요."},{"id":"lr04","text":"계약금을 임대인이 아닌 중개보조원 개인 계좌로 송금한다.","danger":true,"title":"계약금 수령인 불일치","why":"소유자와 무관한 계좌 송금은 권한·수령 여부 분쟁으로 이어질 수 있어요.","action":"소유자 명의 계좌와 수령 권한을 확인하세요."},{"id":"lr05","text":"현재 등기부상 근저당권은 잔금 수령 후 가능한 때에 말소한다.","danger":true,"title":"근저당 말소 시점 불명확","why":"선순위 담보 말소가 보장되지 않으면 보증금 안전성이 달라질 수 있어요.","action":"잔금 지급과 말소를 동시에 이행하도록 조건을 구체화하세요."},{"id":"lr06","text":"임차인은 전입신고를 임대차 시작일로부터 30일 후에 한다.","danger":true,"title":"전입신고 지연 요구","why":"전입신고 지연은 권리 보호 시점에 영향을 줄 수 있어요.","action":"입주 즉시 전입신고가 가능한지 확인하세요."},{"id":"lr07","text":"보증금 반환은 새로운 임차인의 보증금이 입금된 경우에만 한다.","danger":true,"title":"후속 임차인 연계 반환","why":"새 임차인 모집 여부에 보증금 반환을 맡기는 문구는 반환 지연 위험이 있어요.","action":"계약 종료 시 반환 기한과 책임을 명확히 하세요."},{"id":"lr08","text":"임대차 목적물은 현관 표시와 무관하게 임대인이 지정하는 공간으로 한다.","danger":true,"title":"목적물 표시 불명확","why":"계약 대상 호수·면적이 불명확하면 권리 보호 과정에서 문제가 생길 수 있어요.","action":"등기·대장·현관 표시와 일치하도록 목적물을 특정하세요."},{"id":"lr09","text":"임대인은 임차인의 보증보험 가입을 허용하지 않는다.","danger":true,"title":"보증 가입 제한","why":"보증 가입 제한은 보증금 안전장치 활용을 막을 수 있어요.","action":"제한 이유와 해당 주택의 보증 가입 가능 여부를 확인하세요."},{"id":"lr10","text":"관리비의 항목과 금액은 임대인이 매월 임의로 정한다.","danger":true,"title":"관리비 기준 불명확","why":"관리비 산정 기준이 없으면 예상하지 못한 비용 분쟁이 생길 수 있어요.","action":"항목, 금액, 정산 방식을 계약서에 구체적으로 적으세요."},{"id":"ls11","text":"월 차임은 매월 말일에 임대인 명의 계좌로 지급한다.","danger":false},{"id":"ls12","text":"반려동물 사육 여부는 임대인과 임차인이 별지에서 합의한다.","danger":false},{"id":"ls13","text":"통상적인 사용으로 생긴 마모와 노후는 임차인의 원상회복 범위에서 제외한다.","danger":false},{"id":"ls14","text":"임대인은 잔금 수령과 동시에 출입문 열쇠와 공동현관 수단을 인도한다.","danger":false},{"id":"ls15","text":"전기·가스·수도 사용료는 실제 사용량에 따라 임차인이 납부한다.","danger":false},{"id":"ls16","text":"임대인은 관리비를 청구할 때 세부 산출내역을 제공한다.","danger":false},{"id":"ls17","text":"임차인은 임대인의 서면 동의 없이 목적물을 전대하지 않는다.","danger":false},{"id":"ls18","text":"중개보수와 지급 시기는 관계 규정의 범위에서 당사자가 확인한다.","danger":false},{"id":"lr11","text":"공란으로 둔 특약사항은 계약 체결 후 임대인이 필요한 내용을 기재한다.","danger":true,"title":"사후 특약 기재 허용","why":"서명 후 내용이 추가되면 합의하지 않은 의무가 생기거나 문서 진위 분쟁이 발생할 수 있어요.","action":"모든 공란을 정리하고 수정 사항에는 당사자 확인을 남기세요."},{"id":"lr12","text":"임차인이 하루라도 차임을 늦기면 보증금 전액을 위약금으로 지급한다.","danger":true,"title":"과도한 위약금","why":"위반 정도와 무관하게 보증금 전액을 위약금으로 정한 문구는 큰 분쟁 위험이 있어요.","action":"연체 책임과 해지 조건을 합리적이고 구체적으로 협의하세요."},{"id":"lr13","text":"임차인은 대항력과 우선변제권에 관한 모든 권리를 포기한다.","danger":true,"title":"임차인 권리 포기 요구","why":"보증금 보호와 관련된 핵심 권리를 포기하도록 요구하는 문구예요.","action":"서명하지 말고 해당 조항의 삭제와 전문가 검토를 요청하세요."},{"id":"lr14","text":"계약금과 잔금은 영수증 없이 현금으로만 지급한다.","danger":true,"title":"지급 증빙 부재","why":"금전 지급 사실과 수령인을 입증하기 어려워질 수 있어요.","action":"명의가 확인된 계좌와 영수증 등 지급 기록을 남기세요."},{"id":"lr15","text":"임차인은 입주 전 주택 상태를 확인하지 않았으며 모든 하자를 인정한다.","danger":true,"title":"입주 전 하자 확인 포기","why":"숨은 하자까지 임차인이 받아들인 것으로 다툴 여지가 생길 수 있어요.","action":"입주 전 점검표와 사진을 남기고 수리 책임을 구분하세요."},{"id":"lr16","text":"임대인은 별도 합의 없이 매월 차임을 원하는 만큼 인상할 수 있다.","danger":true,"title":"일방적 차임 인상","why":"인상 기준과 절차가 없어 예측하지 못한 주거비 부담으로 이어질 수 있어요.","action":"인상 조건과 적용 시점을 명확히 합의하세요."},{"id":"lr17","text":"임대인은 사전 통보 없이 언제든지 주택에 출입할 수 있다.","danger":true,"title":"무제한 출입 허용","why":"임차인의 주거 평온과 사생활 침해 분쟁이 생길 수 있어요.","action":"긴급 상황을 제외한 방문 사전 통보와 동의 절차를 정하세요."},{"id":"lr18","text":"임대인의 국세와 지방세 체납액은 임차인이 대신 납부한다.","danger":true,"title":"임대인 세금 전가","why":"임대인의 조세 채무를 임차인에게 전가하는 비정상적인 문구예요.","action":"계약을 보류하고 체납 여부와 특약 삭제를 확인하세요."},{"id":"ls19","text":"잔금 지급 직전 등기사항증명서를 다시 확인하고 새로운 권리변동이 없을 때 잔금을 지급한다.","danger":false},{"id":"ls20","text":"주택의 사유로 보증보험 가입이 거절되면 임차인은 계약을 해제하고 지급금을 반환받는다.","danger":false},{"id":"ls21","text":"임대인은 계약 전 체납 여부 확인에 필요한 납세정보 제공 절차에 협조한다.","danger":false},{"id":"lr19","text":"임차인이 보증보험 가입 가능 여부를 조회하면 임대인은 계약금을 반환하지 않고 계약을 해제할 수 있다.","danger":true,"title":"보증 조회 방해 특약","why":"보증 가입 가능성 확인 자체를 막아 주택이나 임대인의 위험 정보를 확인하기 어렵게 만들어요.","action":"해당 특약을 삭제하고 계약 전에 보증 가입 가능 여부를 확인하세요."},{"id":"lr20","text":"임대차 종료 후 보증금은 목적물 인도일로부터 90일 이내에 반환한다.","danger":true,"title":"보증금 반환 장기 유예","why":"집을 먼저 인도한 뒤 장기간 보증금을 받지 못하는 구조가 될 수 있어요.","action":"목적물 인도와 보증금 반환의 동시이행 조건을 협의하세요."},{"id":"lr21","text":"잔금일 전에 발생한 관리비와 공과금 체납도 입주 후 임차인이 정산한다.","danger":true,"title":"기존 체납액 전가","why":"임차인이 사용하지 않은 기간의 비용까지 부담하는 문구예요.","action":"입주 전 체납액은 임대인이 정산하고 확인서를 남기도록 하세요."}]},{"type":"등기사항전부증명서","stamp":"권리 분석","subtitle":"갑구와 을구에서 위험 신호를 찾으세요","clauses":[{"id":"rs01","text":"[표제부] 철근콘크리트구조 공동주택 제5층 제502호","danger":false},{"id":"rs02","text":"[갑구 1] 소유권보존 / 소유자 홍길동","danger":false},{"id":"rs03","text":"[갑구 2] 소유권이전 / 매매 / 소유자 이온","danger":false},{"id":"rs04","text":"[을구] 기록사항 없음","danger":false},{"id":"rs05","text":"발급일시: 2026년 7월 26일 10:32","danger":false},{"id":"rs06","tex let state={screen:'start',round:0,rounds:[],picked:[],found:[],mistakes:0,seconds:75,open:null,failed:false,blasting:false,endReason:null,timer:null};
const el=document.getElementById('app'),shuffle=a=>[...a].sort(()=>Math.random()-.5),pickThree=a=>{const advanced=a.filter(x=>Number(x.id.slice(-2))>=19),standard=a.filter(x=>Number(x.id.slice(-2))<19);return [...shuffle(advanced).slice(0,1),...shuffle(standard).slice(0,2)]},sample=()=>POOLS.map(r=>({...r,clauses:shuffle([...pickThree(r.clauses.filter(x=>x.danger)),...pickThree(r.clauses.filter(x=>!x.danger))])}));
function start(){clearInterval(state.timer);state={...state,screen:'play',round:0,rounds:sample(),picked:[],found:[],mistakes:0,seconds:75,open:null,failed:false,blasting:false,endReason:null};state.timer=setInterval(()=>{if(!state.open&&!state.blasting){state.seconds--;if(state.seconds<=0){clearInterval(state.timer);state.seconds=0;state.endReason='timeout';state.blasting=true;render();setTimeout(()=>{state.blasting=false;state.screen='result';render()},900);return}render()}},1000);render()}
function pick(id){if(state.blasting||state.open||state.picked.includes(id))return;const c=state.rounds[state.round].clauses.find(x=>x.id===id);state.picked.push(id);if(c.danger){state.found.push(c);state.open=c}else{state.mistakes++;if(state.mistakes>=3){state.endReason='mistakes';state.blasting=true;clearInterval(state.timer);render();setTimeout(()=>{state.blasting=false;state.failed=true;state.screen='result';render()},900);return}}render()}
function proceed(){state.open=null;const r=state.rounds[state.round],n=state.picked.filter(id=>r.clauses.find(c=>c.id===id)?.danger).length;if(n===3){if(state.round<2){state.round++;state.picked=[]}else{clearInterval(state.timer);state.screen='result'}}render()}
function render(){if(state.blasting){el.innerHTML='<section class="blast"><i>💥</i><b>'+(state.endReason==='timeout'?'시간 종료!':'계약 실패!')+'</b></section>';return}if(state.screen==='start'){el.innerHTML='<header class="top"><b>자취:ON</b><span class="pill">계약 안전 미니게임</span></header><section class="cover"><div class="docs"><span class="seal">위험<br>탐지</span></div><p class="kicker">읽지 않으면 밟는다</p><h1>계약서<br><em>지뢰찾기</em></h1><p class="lead">계약 문서 속 위험 신호를<br>제한시간 안에 찾아보세요.</p><div class="rules"><div><b>3</b><span>종류의 문서</span></div><div><b>9</b><span>개의 위험</span></div><div><b>75</b><span>초 제한시간</span></div></div><button class="primary" onclick="start()">계약서 펼치기</button><p class="note">교육용 예시이며 실제 계약의 법률 판단을 대신하지 않습니다.</p></section>';return}if(state.screen==='result'){const score=Math.max(0,state.found.length*900+state.seconds*12-state.mistakes*280),rank=state.failed?'F':score>=9000?'S':score>=7000?'A':score>=5000?'B':'C';el.innerHTML='<section class="result"><div class="resultTop"><p class="kicker">'+(state.failed?'계약 안전 진단 실패':'계약 안전 진단 완료')+'</p><div class="rank">'+rank+'</div><h1>'+(state.failed?'계약서 폭발':score.toLocaleString()+'점')+'</h1><p>'+state.found.length+'/9개 발견 · 오탐 '+state.mistakes+'회</p></div><div class="resultBody"><h2>'+(state.failed?'도장 찍기 전에 다시 확인!':'계약 위험 탐지 결과')+'</h2><div class="found">'+state.found.map((c,i)=>'<div>'+(i+1)+'. <b>'+c.title+'</b></div>').join('')+'</div><button class="primary" onclick="start()">처음부터 다시 탐지</button><button class="secondary" onclick="state.screen='start';render()">첫 화면으로</button></div></section>';return}const r=state.rounds[state.round],foundHere=state.picked.filter(id=>r.clauses.find(c=>c.id===id)?.danger).length;el.innerHTML='<header class="gameHead"><div><small>ROUND '+(state.round+1)+'/3</small><b>'+r.type+'</b></div><div class="timer">'+Math.floor(state.seconds/60)+':'+String(state.seconds%60).padStart(2,'0')+'</div></header><div class="mission"><span>'+r.subtitle+'</span><b>'+foundHere+'/3</b></div><section class="paper"><h2>'+r.type+'</h2>'+r.clauses.map((c,i)=>{const s=state.picked.includes(c.id);return '<button class="clause '+(s?(c.danger?'hit':'miss'):'')+'" '+(s?'disabled':'')+' onclick="pick(''+c.id+'')"><span>'+String(i+1).padStart(2,'0')+'</span><p>'+c.text+'</p>'+(s?'<b class="tag">'+(c.danger?'위험 발견':'안전 문구')+'</b>':'')+'</button>'}).join('')+'</section><footer class="foot"><span>오탐 <b>'+('●'.repeat(state.mistakes)+'○'.repeat(3-state.mistakes))+'</b></span><span>위험 '+(3-foundHere)+'개 남음</span></footer>'+(state.open?'<div class="modal"><section class="modalBox"><p class="kicker">위험 신호 발견</p><h2>'+state.open.title+'</h2><blockquote>'+state.open.text+'</blockquote><b>왜 위험할까요?</b><p>'+state.open.why+'</p><div class="tip"><b>계약 전에 이렇게</b><p>'+state.open.action+'</p></div><button class="primary" onclick="proceed()">확인했어요</button></section></div>':'')}
render();</script></body></html>
