<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>자취:ON 맛집 지도</title>
  <style>
    :root{--ink:#17352b;--green:#12865f;--green2:#19a676;--cream:#f7f4eb;--line:#dedbd2;--muted:#718078;--coral:#ff684f;--yellow:#f5b93b;--rose:#ec4662}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;overflow:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer}
    header{height:82px;display:flex;align-items:center;padding:0 3vw;background:#fbf9f3;border-bottom:1px solid var(--line)}header img{width:154px;height:auto;display:block}
    .hero{height:174px;padding:24px 3vw 16px;display:grid;grid-template-columns:1fr auto;gap:24px}.hero h1{margin:0;font-family:Georgia,"Noto Serif KR",serif;font-size:clamp(30px,3.2vw,53px);line-height:1.1}.hero h1 span{color:var(--green)}.hero p{margin:8px 0 14px;color:var(--muted);font-size:16px}.count{align-self:center;background:white;border:1px solid var(--line);border-radius:22px;padding:18px 25px;box-shadow:0 10px 30px #17352b13;white-space:nowrap;font-size:18px}.count strong{color:var(--green);font-size:34px;margin-right:6px}
    .filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.filter-set{display:flex;align-items:center;gap:6px;padding-right:10px;border-right:1px solid #d7d2c7}.filter-label{font-size:12px;font-weight:800;color:#7a817c;margin-right:2px}.chip{border:1px solid #d6d9d4;background:#fff;color:#50635b;border-radius:999px;padding:8px 13px;font-weight:750;font-size:13px}.chip:hover{border-color:var(--green)}.chip.active{background:var(--green);border-color:var(--green);color:#fff}.chip:disabled{background:#eee;color:#aaa;border-color:#ddd;cursor:not-allowed}.chip.saved{border-color:#f0b5b0;color:#c94e43}.chip.saved.active{background:#e95d4f;border-color:#e95d4f;color:#fff}
    main{height:calc(100vh - 256px);min-height:420px;padding:0 2vw 22px;display:grid;grid-template-columns:minmax(275px,30%) 1fr;gap:0}.sidebar{background:#fff;border:1px solid var(--line);border-right:0;border-radius:26px 0 0 26px;overflow:hidden;display:flex;flex-direction:column}.sidehead{padding:26px 28px 16px;display:flex;align-items:center;justify-content:space-between}.eyebrow{color:var(--green);font-weight:900;font-size:16px}.sidehead h2{font-family:Georgia,"Noto Serif KR",serif;font-size:30px;margin:7px 0 0}.add{width:56px;height:56px;border:0;border-radius:50%;background:var(--green);color:#fff;font-size:34px;box-shadow:0 10px 24px #12865f40}.restaurant-list{padding:0 20px 28px;overflow:auto}.empty{padding:28px;text-align:center;color:var(--muted);line-height:1.7}.restaurant{width:100%;display:grid;grid-template-columns:48px 1fr auto;gap:13px;align-items:center;text-align:left;border:1px solid transparent;background:transparent;border-radius:18px;padding:13px;margin-bottom:7px}.restaurant:hover,.restaurant.active{background:#edf8f3;border-color:#c8e4d6}.rank{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--green2);color:#fff;font-weight:900}.restaurant:nth-child(3n+2) .rank{background:var(--yellow)}.restaurant:nth-child(3n) .rank{background:var(--coral)}.rmeta b{display:block;font-size:17px;margin-bottom:4px}.tags{color:var(--green);font-size:11px;font-weight:850}.address{color:#929994;font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini-save{font-size:21px;color:#bcc5c0}.mini-save.on{color:#e95d4f}
    .mapwrap{position:relative;min-width:0;min-height:320px;border-radius:0 26px 26px 0;overflow:hidden;border:1px solid var(--line);background:#dfece7}.map{position:absolute;inset:0;width:100%;height:100%;min-height:320px;z-index:1}.map-error{position:absolute;inset:0;display:none;place-items:center;text-align:center;background:#eaf2ef;padding:30px;z-index:9}.detail{position:absolute;z-index:5;left:50%;right:auto;transform:translateX(-50%);bottom:18px;width:60%;min-width:560px;max-width:820px;min-height:101px;background:#fffffff2;border:1px solid #e6e3da;border-radius:20px;box-shadow:0 14px 45px #17352b25;display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 14px;backdrop-filter:blur(10px)}.detail.hidden{display:none}.detail.long-address{width:82%;max-width:1100px;min-height:116px;padding-top:13px;padding-bottom:13px}.heartmark{width:48px;height:48px;border-radius:14px;background:var(--coral);display:grid;place-items:center;color:#fff;font-size:23px}.detail h3{margin:2px 0;font-size:20px}.detail .small{font-size:11px;color:#7d8782;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32vw}.detail.long-address .small{max-width:none;white-space:normal;overflow:visible;text-overflow:clip;line-height:1.45;overflow-wrap:anywhere}.actions{display:grid;grid-template-columns:repeat(3,auto);gap:5px;align-items:center;min-width:max-content}.action{height:34px;border:1px solid #dcdedb;background:#fff;border-radius:10px;padding:0 8px;font-size:11px;font-weight:800}.action.on{border-color:#15936a;background:#e8f7f1;color:#08744f}.naver-link{grid-column:1/-1;color:#087b57;font-weight:800;font-size:10px;text-align:right;text-decoration:none}.map-pick{position:absolute;z-index:7;top:18px;left:50%;transform:translateX(-50%);display:none;background:#163d31;color:white;border-radius:999px;padding:11px 17px;box-shadow:0 8px 25px #0003;font-weight:800;font-size:13px}.map-pick.show{display:block}
    .jachwion-marker{width:42px;height:42px;border-radius:50% 50% 50% 8px;transform:rotate(-45deg);border:4px solid #fff;box-shadow:0 4px 12px #0004;display:grid;place-items:center;transition:transform .15s,box-shadow .15s,border-color .15s}.jachwion-marker.selected{border-color:#ffb3ad;box-shadow:0 0 0 7px #ffb3ad66,0 6px 18px #0005;transform:rotate(-45deg) scale(1.18)}.jachwion-marker span{transform:rotate(45deg);color:white;font-size:18px}
    .chip.dart{border-color:#d5b6ee;color:#70439a}.chip.dart.active{background:#70439a;border-color:#70439a;color:#fff}.dart-game{position:absolute;inset:0;z-index:7;pointer-events:none;display:none}.dart-game.active{display:block}.dart-guide{position:absolute;height:3px;border-radius:999px;background:linear-gradient(90deg,#70439a,#d79bff);transform-origin:0 50%;opacity:0}.dart-launcher{position:absolute;left:50%;bottom:35px;width:82px;height:48px;margin-left:-41px;border:0;background:transparent;display:grid;place-items:center;filter:drop-shadow(0 7px 5px #24143166);pointer-events:auto;touch-action:none;user-select:none;cursor:grab;transform:rotate(-90deg);transition:filter .15s}.dart-launcher:active{cursor:grabbing}.dart-launcher.dragging{filter:drop-shadow(0 0 8px #b767eb) drop-shadow(0 9px 6px #24143177)}.dart-object{position:relative;display:block;width:76px;height:24px}.dart-fin{position:absolute;left:0;top:2px;width:22px;height:20px;background:linear-gradient(135deg,#9d48c8,#5b217d);clip-path:polygon(0 0,100% 32%,100% 68%,0 100%,30% 50%)}.dart-shaft{position:absolute;left:17px;top:10px;width:31px;height:4px;border-radius:3px;background:linear-gradient(#f1f3f4,#7c858b)}.dart-barrel{position:absolute;left:39px;top:6px;width:24px;height:12px;border-radius:3px 8px 8px 3px;background:repeating-linear-gradient(90deg,#c68b20 0 3px,#f4c95d 3px 6px);clip-path:polygon(0 18%,82% 0,100% 50%,82% 100%,0 82%)}.dart-tip{position:absolute;left:61px;top:10px;width:15px;height:4px;background:linear-gradient(#f5f6f6,#848b90);clip-path:polygon(0 18%,100% 50%,0 82%)}.dart-power{position:absolute;left:50%;bottom:11px;transform:translateX(-50%);color:#5b317e;font-size:10px;font-weight:900;white-space:nowrap}.dart-flight{position:absolute;left:0;top:0;z-index:9;pointer-events:none;will-change:transform;filter:drop-shadow(0 4px 3px #0005)}.dart-flight .dart-object{transform:scale(.86)}.dart-hit{position:absolute;z-index:8;width:76px;height:24px;transform-origin:100% 50%;pointer-events:none;filter:drop-shadow(0 0 5px #c877ff) drop-shadow(0 5px 3px #0005);animation:dartPulse .6s ease-in-out infinite alternate}.dart-hit .dart-object{transform:scale(.78);transform-origin:100% 50%}@keyframes dartPulse{to{filter:drop-shadow(0 0 10px #9f45dc) drop-shadow(0 6px 4px #0006)}}
    .modal{position:fixed;z-index:30;inset:0;background:#10251f88;display:none;place-items:center;padding:20px}.modal.open{display:grid}.dialog{width:min(570px,96vw);max-height:88vh;overflow:auto;background:#fff;border-radius:24px;padding:25px;box-shadow:0 25px 70px #0004}.dialog-head{display:flex;justify-content:space-between;align-items:center}.dialog h2{margin:0;font-size:24px}.close{border:0;background:#edf2ef;width:38px;height:38px;border-radius:50%;font-size:20px}.tabs{display:flex;gap:7px;margin:20px 0 15px}.tab{flex:1;border:1px solid #d8ddd9;background:#fff;padding:10px;border-radius:11px;font-weight:800}.tab.active{background:var(--green);color:#fff;border-color:var(--green)}.searchrow{display:flex;gap:8px}.searchrow input{flex:1}.field,input,select,textarea{width:100%;border:1px solid #d5dbd7;border-radius:12px;padding:11px;background:#fff}label{display:block;font-size:13px;font-weight:800;margin:14px 0 6px}.searchbtn,.submit{border:0;background:var(--green);color:white;border-radius:12px;padding:0 17px;font-weight:850}.results{margin-top:10px;display:grid;gap:6px}.result{border:1px solid #e1e4e2;background:#fff;border-radius:12px;padding:10px;text-align:left}.result:hover{border-color:var(--green);background:#f0faf6}.result b{display:block}.result small{color:#7b8580}.draft{margin-top:13px;padding:12px;border-radius:13px;background:#eef7f3;display:none}.draft.show{display:block}.tag-options{display:flex;gap:7px;flex-wrap:wrap}.tag-option input{display:none}.tag-option span{display:block;border:1px solid #d7dcd9;border-radius:999px;padding:8px 12px;font-size:13px}.tag-option input:checked+span{background:var(--green);border-color:var(--green);color:white}.submit{width:100%;padding:13px;margin-top:18px}.status{font-size:12px;color:#bd5146;margin-top:8px;min-height:18px}.toast{position:fixed;z-index:50;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:#17352b;color:white;border-radius:12px;padding:12px 18px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
    .price-range{border:1px solid #dfe4e1;border-radius:15px;background:#f7fbf9;padding:12px 14px 10px}.price-values{display:flex;align-items:center;justify-content:center;gap:8px}.price-value{border:1px solid #d8dfdb;background:#fff;border-radius:10px;padding:6px 9px;color:#53645c;font-size:11px}.price-value b{display:block;color:var(--ink);font-size:13px;margin-top:2px}.price-value.active{border-color:var(--green);box-shadow:0 0 0 2px #12865f18}.dual-range{position:relative;height:34px;margin:8px 7px 0}.price-track,.price-fill{position:absolute;left:0;right:0;top:15px;height:4px;border-radius:999px}.price-track{background:#d8e2dd}.price-fill{right:auto;background:var(--green)}.dual-range input[type=range]{position:absolute;inset:0;width:100%;height:34px;margin:0;padding:0;border:0;background:transparent;appearance:none;pointer-events:none}.dual-range input[type=range]::-webkit-slider-runnable-track{height:4px;background:transparent}.dual-range input[type=range]::-webkit-slider-thumb{appearance:none;width:20px;height:20px;margin-top:-8px;border:3px solid #fff;border-radius:50%;background:var(--green);box-shadow:0 2px 8px #17352b55;pointer-events:auto;cursor:grab}.dual-range input[type=range]::-moz-range-track{height:4px;background:transparent}.dual-range input[type=range]::-moz-range-thumb{width:15px;height:15px;border:3px solid #fff;border-radius:50%;background:var(--green);box-shadow:0 2px 8px #17352b55;pointer-events:auto;cursor:grab}.price-ticks{display:grid;grid-template-columns:repeat(6,1fr);margin:0 2px;color:#84918b;font-size:9px;text-align:center}.price-ticks span{position:relative;padding-top:9px}.price-ticks span:before{content:"";position:absolute;top:0;left:50%;width:1px;height:6px;background:#aebbb5}.price-ticks span:first-child{text-align:left}.price-ticks span:first-child:before{left:0}.price-ticks span:last-child{text-align:right}.price-ticks span:last-child:before{left:auto;right:0}
    @media(max-width:800px){body{overflow:auto}header{height:64px}header img{width:125px}.hero{height:auto;display:block;padding:18px}.hero h1{font-size:32px}.count{display:none}.filters{margin-top:12px}.filter-set{border:0;padding:0}.filter-label{display:none}main{height:calc(100vh - 230px);min-height:620px;padding:0 10px 10px;grid-template-columns:1fr;grid-template-rows:190px 1fr}.sidebar{border-radius:18px 18px 0 0;border-right:1px solid var(--line);border-bottom:0}.sidehead{padding:15px 18px 7px}.sidehead h2{font-size:23px}.add{width:43px;height:43px}.restaurant-list{display:flex;overflow:auto;padding:0 12px}.restaurant{min-width:235px}.mapwrap{border-radius:0 0 18px 18px}.detail{left:50%;right:auto;width:calc(100% - 20px);min-width:0;bottom:10px;min-height:116px;padding:10px;grid-template-columns:44px minmax(0,1fr)}.detail.long-address{width:calc(100% - 20px);min-height:132px}.heartmark{width:42px;height:42px}.actions{grid-column:1/-1;justify-content:end;margin-top:-7px}.detail .small{max-width:65vw}.detail.long-address .small{max-width:none}.dart-launcher{bottom:31px}}
    .admin-actions{display:none;grid-column:2/4;justify-content:flex-end;gap:5px;margin-top:-5px}.admin-mode .admin-actions{display:flex}.admin-action{border:1px solid #d7dcd8;background:#fff;border-radius:8px;padding:5px 9px;font-size:11px;font-weight:800;color:#526159}.admin-action:hover{border-color:var(--green);color:var(--green)}.admin-action.delete{color:#d45549}.admin-action.delete:hover{border-color:#ef9d96;background:#fff5f4}
  </style>
</head>
<body>
  <header><img src="public/jachwion-logo-transparent.png" alt="자취:ON"></header>
  <section class="hero"><div><h1>혼자 알기 아까운 <span>진짜 맛집</span></h1><p>자취생들이 직접 저장한 맛집을 한 지도에서 만나보세요.</p><div class="filters"><div class="filter-set"><span class="filter-label">보기</span><button class="chip active" data-primary="top7">TOP 7</button><button class="chip" data-primary="all">전체 보기</button></div><div class="filter-set"><span class="filter-label">카테고리</span><button class="chip" data-category="동네 맛집">동네 맛집</button><button class="chip" data-category="데이트 맛집">데이트 맛집</button><button class="chip" data-category="디저트 맛집">디저트 맛집</button><button class="chip" data-category="안주 맛집">안주 맛집</button></div><button id="savedFilter" class="chip saved">♡ 저장한 맛집 <span id="savedCount">0</span></button><button id="dartToggle" class="chip dart">🎯 다트 던지기</button></div></div><div class="count"><strong id="visibleCount">0</strong>표시 중</div></section>
  <main><aside class="sidebar"><div class="sidehead"><div><div class="eyebrow">공유 맛집</div><h2>서울 맛집 리스트</h2></div><button class="add" id="openAdd" aria-label="맛집 추가">+</button></div><div class="restaurant-list" id="list"></div></aside><section class="mapwrap"><div id="map" class="map"></div><div id="mapError" class="map-error"></div><div id="mapPick" class="map-pick">지도에서 가게 위치를 클릭해 주세요 · 취소 Esc</div><div id="dartGame" class="dart-game" aria-hidden="true"><div id="dartGuide" class="dart-guide"></div><button id="dartLauncher" class="dart-launcher" aria-label="다트 당겨서 던지기" draggable="true"><span class="dart-object"><i class="dart-fin"></i><i class="dart-shaft"></i><i class="dart-barrel"></i><i class="dart-tip"></i></span></button><div id="dartPower" class="dart-power">힘 0%</div></div><article id="detail" class="detail hidden"><div id="detailBadge" class="heartmark">♥</div><div><div id="detailTags" class="tags"></div><h3 id="detailName"></h3><div id="detailAddress" class="small"></div></div><div class="actions"><button id="likeBtn" class="action">👍 <span></span></button><button id="dislikeBtn" class="action">👎 <span></span></button><button id="saveBtn" class="action" aria-label="맛집 저장" title="저장">♡</button><a id="naverLink" class="naver-link" target="_blank" rel="noreferrer">네이버 지도에서 보기 ↗</a></div></article></section></main>
  <div id="modal" class="modal"><div class="dialog"><div class="dialog-head"><h2>맛집 추가</h2><button class="close" id="closeModal">×</button></div><div class="tabs"><button class="tab active" data-tab="search">가게 이름 검색</button><button class="tab" data-tab="map">지도에서 위치 선택</button></div><section id="searchPane"><div class="searchrow"><input id="searchInput" placeholder="예: 성수 소문난성수감자탕"><button id="searchBtn" class="searchbtn">검색</button></div><div id="searchStatus" class="status"></div><div id="results" class="results"></div></section><section id="mapPane" hidden><p>버튼을 누른 뒤 지도에서 식당 위치를 클릭하세요.</p><button id="startPick" class="submit">지도에서 위치 선택</button></section><form id="placeForm" hidden><div id="draft" class="draft"></div><label for="placeName">가게 이름</label><input id="placeName" required><label>맛집 카테고리 (복수 선택 가능)</label><div class="tag-options"><label class="tag-option"><input type="checkbox" name="tags" value="동네 맛집"><span>동네 맛집</span></label><label class="tag-option"><input type="checkbox" name="tags" value="데이트 맛집"><span>데이트 맛집</span></label><label class="tag-option"><input type="checkbox" name="tags" value="디저트 맛집"><span>디저트 맛집</span></label><label class="tag-option"><input type="checkbox" name="tags" value="안주 맛집"><span>안주 맛집</span></label></div><label for="foodCategory">대표 메뉴</label><input id="foodCategory" required placeholder="예: 김치찌개, 마라탕, 티라미수"><label>가격대</label><div class="price-range"><div class="price-values"><button type="button" id="priceMinLabel" class="price-value active" data-price-handle="min">최저<b id="priceMinText">5,000원</b></button><span>~</span><button type="button" id="priceMaxLabel" class="price-value" data-price-handle="max">최고<b id="priceMaxText">30,000원 이상</b></button></div><div class="dual-range"><div class="price-track"></div><div id="priceFill" class="price-fill"></div><input id="priceMin" type="range" min="5000" max="30000" step="5000" value="5000" aria-label="최저 가격"><input id="priceMax" type="range" min="5000" max="30000" step="5000" value="30000" aria-label="최고 가격"></div><div class="price-ticks"><span>5천</span><span>1만</span><span>1.5만</span><span>2만</span><span>2.5만</span><span>3만+</span></div></div><label for="note">한 줄 소개</label><textarea id="note" rows="2" placeholder="추천 메뉴나 특징을 적어주세요"></textarea><div id="formStatus" class="status"></div><button class="submit" type="submit">이 맛집 등록하기</button></form></div></div><div id="toast" class="toast"></div>
